name: Check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Formatting is checked, not auto-committed: run `npm run format` locally before pushing
      - run: npm run lint
      - run: npm run check
      - run: npm run build
