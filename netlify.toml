# Node comes from .nvmrc, which Netlify reads automatically
[build]
  command = "npm run build"
  publish = "build"

# Static assets are content-hashed by Vite, so they can be cached forever
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
