<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- favicon.svg follows the OS light itself; a forced light swaps in its own icon -->
		<link id="tab-icon" rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon-day.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<!-- The site ships its own dark theme; ask Dark Reader not to repaint it -->
		<meta name="darkreader-lock" />
		<script>
			// A saved choice overrides the OS light; without one, CSS follows prefers-color-scheme
			try {
				const saved = localStorage.getItem('theme');
				if (saved === 'day' || saved === 'night') {
					document.documentElement.setAttribute('data-theme', saved);
				} else if (saved) {
					localStorage.removeItem('theme');
				}
			} catch {
				// localStorage unavailable; follow the OS preference
			}
			// A forced light gets its own tab icon (theme.ts keeps it in sync after). The link is
			// replaced, not edited: Chrome ignores href changes on an existing icon link
			const forced = document.documentElement.dataset.theme;
			if (forced) {
				const icon = document.getElementById('tab-icon');
				const next = icon.cloneNode();
				next.href = `%sveltekit.assets%/favicon-${forced}.svg`;
				icon.replaceWith(next);
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
